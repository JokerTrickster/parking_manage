services:
  mysql:
    image: mysql:8.0
    container_name: parking_manage_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-luxrobo1!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parking_dev}
      MYSQL_USER: ${MYSQL_USER:-luxrobo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-luxrobo1!}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - parking_network

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: parking_manage_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./shared:/app/shared
      - ./data:/app/data
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-parking_dev}
      - DB_USER=${DB_USER:-luxrobo}
      - DB_PASSWORD=${DB_PASSWORD:-luxrobo1!}
      - UPLOAD_PATH=${UPLOAD_PATH:-/app/shared}
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - parking_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parking_manage_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./shared:/app/shared
      - ./frontend/src:/app/src
    environment:
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - parking_network

volumes:
  shared_data:
  mysql_data:

networks:
  parking_network:
    driver: bridge
