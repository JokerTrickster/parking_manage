name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false  # 자동 정리 비활성화 (권한 문제 방지)

      - name: Set up environment variables
        run: |
          # Create .env file for production deployment
          cat > .env << EOF
          # Production Configuration
          MYSQL_PORT=3307
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}

          BACKEND_PORT=5000
          DB_HOST=mysql
          DB_PORT=3306
          DB_NAME=${{ secrets.MYSQL_DATABASE }}
          DB_USER=${{ secrets.MYSQL_USER }}
          DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          UPLOAD_PATH=/app/shared

          FRONTEND_PORT=5050
          HOST=0.0.0.0
          CHOKIDAR_USEPOLLING=true
          WATCHPACK_POLLING=true
          EOF

      - name: Stop existing containers
        run: |
          docker-compose down || true
        continue-on-error: true

      - name: Clean up old images
        run: |
          docker image prune -f || true
        continue-on-error: true

      - name: Build and start containers
        run: |
          docker-compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 30

          # Check if containers are running
          docker-compose ps

      - name: Verify deployment
        run: |
          # Check MySQL
          if docker-compose exec -T mysql mysqladmin ping -h localhost --silent; then
            echo "✅ MySQL is healthy"
          else
            echo "❌ MySQL health check failed"
            exit 1
          fi

          # Check Backend (port 5000) with retry
          echo "Checking Backend health..."
          for i in {1..10}; do
            if curl -f http://localhost:5000/health 2>/dev/null || curl -f http://localhost:5000/api/health 2>/dev/null || curl -f http://localhost:5000 2>/dev/null; then
              echo "✅ Backend is healthy"
              break
            else
              if [ $i -eq 10 ]; then
                echo "❌ Backend health check failed after 10 attempts"
                exit 1
              fi
              echo "Backend not ready, retrying... ($i/10)"
              sleep 3
            fi
          done

          # Check Frontend (port 5050) - verify container is running
          echo "Checking Frontend container status..."
          if docker-compose ps frontend | grep -q "Up"; then
            echo "✅ Frontend container is running"

            # Wait for webpack compilation to complete
            echo "Waiting for webpack compilation..."
            for i in {1..20}; do
              if docker-compose logs frontend | grep -q "webpack compiled"; then
                echo "✅ Frontend webpack compilation successful"
                break
              else
                if [ $i -eq 20 ]; then
                  echo "⚠️  Frontend webpack compilation not detected, but container is running"
                  docker-compose logs --tail 50 frontend
                  break
                fi
                echo "Waiting for compilation... ($i/20)"
                sleep 3
              fi
            done
          else
            echo "❌ Frontend container is not running"
            docker-compose logs frontend
            exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== MySQL Logs ==="
          docker-compose logs mysql
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo "=== Frontend Logs ==="
          docker-compose logs frontend

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Services are running on:"
          echo "  - MySQL: localhost:3307"
          echo "  - Backend: localhost:5000"
          echo "  - Frontend: localhost:5050"
