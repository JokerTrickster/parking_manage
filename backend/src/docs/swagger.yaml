definitions:
  entity.FileInfo:
    properties:
      cctv_id:
        description: CCTV ID for learning/test images (optional)
        type: string
      file_type:
        description: MIME type
        type: string
      filename:
        description: Actual filename on disk (may be versioned)
        type: string
      original_name:
        description: Original filename without version
        type: string
      path:
        description: Full path on filesystem
        type: string
      size_bytes:
        description: File size in bytes
        type: integer
      upload_date:
        description: When file was uploaded
        type: string
      version:
        description: Version timestamp (empty for non-versioned)
        type: string
    type: object
  main_features_filestorage_model_response.ResUpload:
    properties:
      errors:
        description: Error messages for failed files
        items:
          type: string
        type: array
      failed_count:
        type: integer
      success_count:
        type: integer
      total_files:
        type: integer
      uploaded_files:
        description: List of successfully uploaded files
        items:
          $ref: '#/definitions/entity.FileInfo'
        type: array
      version:
        description: Version timestamp for versioned files
        type: string
    type: object
  main_features_roi_model_response.ResUpload:
    properties:
      failed:
        type: integer
      success:
        type: integer
      total_files:
        type: integer
    type: object
  request.CreateRoiRequest:
    properties:
      cctv_id:
        type: string
      coords:
        items:
          type: integer
        type: array
      roi_file:
        type: string
      roi_id:
        type: string
    type: object
  request.DeleteRoiRequest:
    properties:
      cctv_id:
        type: string
      roi_file:
        type: string
      roi_id:
        type: string
    type: object
  request.LabelData:
    properties:
      has_vehicle:
        type: boolean
      roi_id:
        type: string
    type: object
  request.ReadRoiRequest:
    properties:
      cctv_id:
        type: string
      roi_file:
        type: string
    type: object
  request.ReqDeleteFile:
    properties:
      deleteName:
        type: string
    required:
    - deleteName
    type: object
  request.ReqLabelSave:
    properties:
      labels:
        items:
          $ref: '#/definitions/request.LabelData'
