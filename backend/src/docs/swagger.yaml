        type: string
      - description: CCTV ID
        in: path
        name: cctvId
        required: true
        type: string
      - description: 라벨 데이터
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ReqLabelSave'
      produces:
      - application/json
      responses:
        "200":
          description: 라벨 데이터 저장 성공
          schema:
            $ref: '#/definitions/response.ResSaveLabel'
        "400":
