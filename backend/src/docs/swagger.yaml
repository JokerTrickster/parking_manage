info:
  contact: {}
paths:
  /v0.1/filestorage/{projectId}/{category}/download/{filename}:
    get:
      description: Downloads the specified file with streaming support
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Category
        in: path
        name: category
        required: true
        type: string
      - description: Filename to download
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: File not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Download a file
      tags:
      - File Storage
  /v0.1/filestorage/{projectId}/{category}/latest:
    get:
      description: Downloads the most recent version of a versioned file (map/cad/roi
        only)
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Category (map, cad, or roi)
        in: path
        name: category
        required: true
        type: string
      - description: Original filename without version
        in: query
        name: original_name
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: File not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Download latest version of a file
      tags:
      - File Storage
  /v0.1/filestorage/{projectId}/{category}/list:
    get:
      description: Returns list of files with metadata. Supports pagination and CCTV
        ID filtering for learning/test categories.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Category (map, cad, roi, learning, test)
        in: path
        name: category
        required: true
        type: string
      - description: Filter by CCTV ID (for learning/test only)
        in: query
        name: cctv_id
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: File list retrieved
          schema:
            $ref: '#/definitions/response.ResFileList'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: List files in a category
      tags:
      - File Storage
  /v0.1/filestorage/{projectId}/{category}/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload files to specified category. Map/CAD/ROI files are automatically
        versioned with timestamp suffix.
      parameters:
      - description: Project ID (e.g., banpo, osong)
        in: path
        name: projectId
        required: true
        type: string
      - description: Category (map, cad, roi, learning, test)
        in: path
        name: category
        required: true
        type: string
      - description: Files to upload (single or multiple)
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Upload successful
          schema:
            $ref: '#/definitions/main_features_filestorage_model_response.ResUpload'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Upload files with optional versioning
      tags:
      - File Storage
  /v0.1/filestorage/{projectId}/map/auto-upload:
    post:
      consumes:
      - multipart/form-data
      description: Asynchronously uploads map JSON file when user exports from map
        editor. Returns immediately (fire-and-forget).
      parameters:
      - description: Project ID (e.g., banpo, osong)
        in: path
        name: projectId
        required: true
        type: string
      - description: Map JSON file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Upload initiated
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
      summary: Auto-upload map JSON from map editor
      tags:
      - File Storage
  /v0.1/parking/{projectId}/{cctvId}/images/{imageType}:
    get:
      consumes:
      - application/json
      description: 실시간 이미지 가져오기
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: CCTV ID
        in: path
        name: cctvId
        required: true
        type: string
      - description: Image type (roi_result or fgmask)
        in: path
        name: imageType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResCctvImage'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 실시간 이미지 가져오기
      tags:
      - parking
  /v0.1/parking/{projectId}/{folderPath}:
    delete:
      consumes:
      - application/json
      description: |
        지정된 프로젝트의 파일/폴더를 삭제합니다.

        ■ errCode with 400
        PARAM_BAD : 파라미터 오류

        ■ errCode with 500
        INTERNAL_SERVER : 내부 로직 처리 실패
        INTERNAL_DB : DB 처리 실패
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Folder Path
        in: path
        name: folderPath
        required: true
        type: string
      - description: 삭제할 파일/폴더 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ReqDeleteFile'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResDeleteFile'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 파일/폴더 삭제
      tags:
      - parking
  /v0.1/parking/{projectId}/{folderPath}/{cctvId}/images/{imageType}:
    get:
      consumes:
      - application/json
      description: Gets a specific image (roi_result or fgmask) for a CCTV
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Learning result folder path
        in: path
        name: folderPath
        required: true
        type: string
      - description: CCTV ID
        in: path
        name: cctvId
        required: true
        type: string
      - description: Image type (roi_result or fgmask)
        in: path
        name: imageType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResImage'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 이미지 불러오기
      tags:
      - parking
  /v0.1/parking/{projectId}/history:
    get:
      consumes:
      - application/json
      description: Gets the learning history for a project
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResHistory'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get Learning History
      tags:
      - parking
  /v0.1/parking/{projectId}/images/batch:
    post:
      consumes:
      - application/json
      description: 배치로 이미지 저장하기
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 배치로 이미지 저장하기
      tags:
      - parking
  /v0.1/parking/{projectId}/images/roi-folders:
    get:
      consumes:
      - application/json
      description: |
        프로젝트의 ROI 파일 폴더 목록과 통계를 조회합니다.

        ■ errCode with 400
        PARAM_BAD : 파라미터 오류

        ■ errCode with 500
        INTERNAL_SERVER : 내부 로직 처리 실패
        INTERNAL_DB : DB 처리 실패
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
